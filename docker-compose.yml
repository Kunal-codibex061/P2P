services:
  mongodb:
    image: mongo:7
    container_name: rentora-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: rentora-backend
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/rentora_v1}
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-rentora-dev-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: rentora-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongodb_data:
